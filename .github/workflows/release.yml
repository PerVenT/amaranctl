name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: amaranctl.exe
            asset_name: amaranctl-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
            archive_type: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: amaranctl
            asset_name: amaranctl-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            archive_type: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: amaranctl
            asset_name: amaranctl-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz
            archive_type: tar

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows archive (zip)
        if: matrix.archive_type == 'zip'
        shell: pwsh
        run: |
          $binPath = "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          Compress-Archive -Path $binPath -DestinationPath ${{ matrix.asset_name }}
          $hash = (Get-FileHash -Algorithm SHA256 ${{ matrix.asset_name }}).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}" | Out-File -Encoding utf8 -FilePath "${{ matrix.asset_name }}.sha256"

      - name: Package Linux archive (tar.gz)
        if: matrix.archive_type == 'tar'
        shell: bash
        run: |
          tar -czf "${{ matrix.asset_name }}" -C "target/${{ matrix.target }}/release" "${{ matrix.artifact_name }}"
          sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          cat *.sha256 | sort -u > SHA256SUMS.txt
          rm -f *.sha256
          echo "SHA256 checksums:"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
