name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v0.1.0' }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: amaranctl.exe
            archive_ext: zip
            archive_type: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: amaranctl
            archive_ext: tar.gz
            archive_type: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: amaranctl
            archive_ext: tar.gz
            archive_type: tar

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows archive (zip)
        if: matrix.archive_type == 'zip'
        shell: pwsh
        run: |
          $assetName = "amaranctl-$env:RELEASE_VERSION-${{ matrix.target }}.${{ matrix.archive_ext }}"
          $binPath = "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          Compress-Archive -Path $binPath -DestinationPath $assetName
          $hash = (Get-FileHash -Algorithm SHA256 $assetName).Hash.ToLower()
          "$hash  $assetName" | Out-File -Encoding utf8 -FilePath "$assetName.sha256"

      - name: Package Linux archive (tar.gz)
        if: matrix.archive_type == 'tar'
        shell: bash
        run: |
          ASSET_NAME="amaranctl-${RELEASE_VERSION}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          tar -czf "$ASSET_NAME" -C "target/${{ matrix.target }}/release" "${{ matrix.artifact_name }}"
          sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            amaranctl-*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          cat *.sha256 | sort -u > SHA256SUMS.txt
          rm -f *.sha256
          echo "SHA256 checksums:"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
